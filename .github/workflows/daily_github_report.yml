name: Daily GitHub Agent Report

on:
  schedule:
    - cron: '0 8 * * *'  # daily at 08:00 UTC
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          pytest -q
      - name: Run central reporter
        if: always()
        env:
          TARGET_GITHUB_USERNAME: sande231
          RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          SMTP_PASS: ${{ secrets.GMAIL_SMTP_PASS }}
          TARGET_GH_PAT: ${{ secrets.TARGET_GH_PAT }}
          AUTO_CREATE_ISSUES: true
          ISSUE_LABEL: agent-report
        run: |
          python central_reporter.py
      - name: Upload dashboard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-agent-dashboard
          path: dashboard.html
