services:
  # Reverse proxy: the ONLY service with ports published to the internet. Terminates
  # HTTPS (auto-issues + renews a Let's Encrypt cert for $DOMAIN) and forwards to the
  # ingestion container over the private compose network. See DEPLOY.md.
  caddy:
    image: caddy:2-alpine
    container_name: synapse_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?Set DOMAIN in .env to your real domain, e.g. dashboard.example.com}
      - ACME_EMAIL=${ACME_EMAIL:?Set ACME_EMAIL in .env - Let's Encrypt uses it for renewal/expiry notices}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      ingestion:
        condition: service_healthy

  ingestion:
    build: .
    container_name: synapse_ingestion
    restart: unless-stopped
    # No "ports:" here on purpose - only reachable from other containers on this compose
    # network (i.e. from caddy), never directly from the internet or the host's own network.
    expose:
      - "5000"
    environment:
      - INGESTION_API_KEY=${INGESTION_API_KEY:-change-me}
      - INGESTION_API_KEY_HEADER=${INGESTION_API_KEY_HEADER:-X-API-KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TARGET_GITHUB_USERNAME=${TARGET_GITHUB_USERNAME:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Must bind 0.0.0.0 *inside* the container so Caddy (a separate container) can reach
      # it - this is safe here specifically because the "expose" above (not "ports") means
      # Docker never forwards this port to the host or the public internet either way.
      - INGESTION_BIND_HOST=0.0.0.0
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME:?Set DASHBOARD_USERNAME in .env before deploying publicly}
      - DASHBOARD_PASSWORD_HASH=${DASHBOARD_PASSWORD_HASH:?Set DASHBOARD_PASSWORD_HASH in .env before deploying publicly}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in .env before deploying publicly}
      - FORCE_HTTPS_COOKIES=1
    volumes:
      - ./email_queue.db:/app/email_queue.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  main_agent:
    build: .
    container_name: synapse_main_agent
    restart: unless-stopped
    environment:
      - INGESTION_URL=http://ingestion:5000
      - INGESTION_API_KEY=${INGESTION_API_KEY:-change-me}
      - INGESTION_API_KEY_HEADER=${INGESTION_API_KEY_HEADER:-X-API-KEY}
      - REPORT_INTERVAL_SECONDS=${REPORT_INTERVAL_SECONDS:-60}
      - SMTP_HOST=${SMTP_HOST:-smtp.example.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - RECIPIENTS=${RECIPIENTS:-ops@example.com}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      ingestion:
        condition: service_healthy

  email_worker:
    build: .
    container_name: synapse_email_worker
    restart: unless-stopped
    command: ["python", "-c", "from email_queue import worker_loop; worker_loop()"]
    environment:
      - SMTP_HOST=${SMTP_HOST:-smtp.example.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./email_queue.db:/app/email_queue.db
    depends_on:
      ingestion:
        condition: service_healthy

  canvas_oauth:
    build: .
    container_name: synapse_canvas_oauth
    restart: unless-stopped
    command: ["python", "canvas_oauth.py", "serve"]
    ports:
      - "8080:8080"
    environment:
      - CANVAS_BASE_URL=${CANVAS_BASE_URL:-}
      - CANVAS_CLIENT_ID=${CANVAS_CLIENT_ID:-}
      - CANVAS_CLIENT_SECRET=${CANVAS_CLIENT_SECRET:-}
      - CANVAS_REDIRECT_URI=${CANVAS_REDIRECT_URI:-http://localhost:8080/canvas/oauth/callback}
      - CANVAS_OAUTH_HOST=0.0.0.0
      - CANVAS_OAUTH_PORT=8080
      - CANVAS_OAUTH_SCOPES=${CANVAS_OAUTH_SCOPES:-}
      - CANVAS_REPLACE_TOKENS=${CANVAS_REPLACE_TOKENS:-false}
      - CANVAS_TOKEN_STORE=/app/.canvas_tokens/canvas_token.json
    volumes:
      - ./.canvas_tokens:/app/.canvas_tokens

  canvas_tutor_adapter:
    build: .
    container_name: synapse_canvas_tutor_adapter
    restart: unless-stopped
    command: ["python", "canvas_tutor_adapter.py"]
    environment:
      - INGESTION_URL=http://ingestion:5000
      - INGESTION_API_KEY=${INGESTION_API_KEY:-change-me}
      - INGESTION_API_KEY_HEADER=${INGESTION_API_KEY_HEADER:-X-API-KEY}
      - AGENT_CONTROL_URL=${AGENT_CONTROL_URL:-http://localhost:9000/control}
      - CANVAS_TUTOR_AGENT_ID=${CANVAS_TUTOR_AGENT_ID:-canvas-tutor-agent}
      - CANVAS_TUTOR_HEARTBEAT_INTERVAL_SECONDS=${CANVAS_TUTOR_HEARTBEAT_INTERVAL_SECONDS:-60}
      - CANVAS_TUTOR_SESSION_COUNT=${CANVAS_TUTOR_SESSION_COUNT:-0}
      - CANVAS_BASE_URL=${CANVAS_BASE_URL:-}
      - CANVAS_CLIENT_ID=${CANVAS_CLIENT_ID:-}
      - CANVAS_CLIENT_SECRET=${CANVAS_CLIENT_SECRET:-}
      - CANVAS_REDIRECT_URI=${CANVAS_REDIRECT_URI:-http://localhost:8080/canvas/oauth/callback}
      - CANVAS_TOKEN_STORE=/app/.canvas_tokens/canvas_token.json
      - CANVAS_ACCESS_TOKEN=${CANVAS_ACCESS_TOKEN:-}
      - CANVAS_TUTOR_VERIFY_API=${CANVAS_TUTOR_VERIFY_API:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./.canvas_tokens:/app/.canvas_tokens
    depends_on:
      ingestion:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
